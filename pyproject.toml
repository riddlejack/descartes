[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "stemma"
version = "0.0.1"
description = "A research system that works like a strong consulting team (working name Stemma 2)."
requires-python = ">=3.12"
license = "Apache-2.0"  # SPDX; the vendored conformance runner is Apache-2.0 too
dependencies = []

# Each part pins its own dependencies in its own group, and edits no other group.
[project.optional-dependencies]
server = ["mcp==2.3.0"]   # part B wires the one MCP server
evidence = [              # part A
    "markdownify==1.2.3",
    "beautifulsoup4==4.15.0",
    "pypdfium2==5.14.0",
    "edgartools==5.62.1",
    "certifi==2026.10.23",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
]
evidence-tables = ["docling==2.142.1"]     # part A, optional: derived table view
register = []             # part B
driver = ["claude-agent-sdk==0.2.174"]  # part B (MIT); evidence test only, the driver runs the CLI itself
datalayer = ["pg8000==1.31.5"]  # part D; BSD-3-Clause (deps MIT-0, MIT, BSD/Apache)
providers = []            # part D (standard library only)
dev = ["pytest==9.1.1", "ruff==0.17.2", "mypy==2.4.0"]

[project.scripts]
stemma-mcp = "stemma.mcp_server:main"
stemma = "stemma.driver.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stemma"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"
